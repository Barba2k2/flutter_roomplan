name: flutter_object_capture_example
description: Demonstrates how to use the flutter_object_capture plugin.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  file_picker: ^13.2.0
  flutter:
    sdk: flutter
  flutter_object_capture:
    path: ../
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
