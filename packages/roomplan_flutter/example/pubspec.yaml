name: example
description: Demonstrates how to use the roomplan_flutter plugin.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  roomplan_flutter:
    path: ../

  cupertino_icons: ^2.0.0
  flutter_cube: ^0.1.1
  provider: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
