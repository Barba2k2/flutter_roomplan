# Master push bumping the version tags roomplan_flutter-v<version> and dispatches this workflow on the tag, which publishes to pub.dev; dispatch on a branch is a dry run.
name: Publish roomplan_flutter
on:
  push:
    branches: [master]
    paths: [packages/roomplan_flutter/pubspec.yaml]
    tags: ['roomplan_flutter-v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tag:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag the version and start the publish run on the tag
        run: |
          v=$(sed -n 's/^version: //p' packages/roomplan_flutter/pubspec.yaml | head -n1)
          [ -n "$v" ] || { echo "no version in pubspec.yaml"; exit 1; }
          tag="roomplan_flutter-v$v"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to do"
            exit 0
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"
          gh workflow run publish-roomplan-flutter.yml --ref "$tag"
  verify:
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/roomplan_flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Tag matches pubspec and CHANGELOG
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#roomplan_flutter-v}"
          grep -Fxq "version: $v" pubspec.yaml || { echo "pubspec.yaml version is not $v"; exit 1; }
          grep -Fxq "## $v" CHANGELOG.md || { echo "CHANGELOG.md has no '## $v' entry"; exit 1; }
      - run: flutter analyze
      - run: flutter test
  publish:
    needs: verify
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'pub.dev' || null }}
    defaults:
      run:
        working-directory: packages/roomplan_flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub publish --dry-run
      - name: Publish
        if: github.ref_type == 'tag'
        run: flutter pub publish --force
